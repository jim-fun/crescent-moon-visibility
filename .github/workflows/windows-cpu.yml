name: Windows CPU-only Build (Initial)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows-cpu:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install MinGW-w64 (for CGO + C++ compilation)
        run: choco install mingw -y

      - name: Set up MinGW environment
        shell: pwsh
        run: |
          echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CXX=g++" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract version info
        id: version
        shell: pwsh
        run: |
          $VERSION = (Get-Content VERSION -Raw).Trim()
          if (-not $VERSION) { $VERSION = "dev" }
          $DATE = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ").ToString()
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "date=$DATE" >> $env:GITHUB_OUTPUT

      - name: Build CPU renderer (C++)
        shell: pwsh
        run: |
          mkdir -p bin
          # Try with OpenMP first; fall back gracefully if libgomp is missing in this MinGW install
          g++ -O3 -Wall -Wextra -fno-exceptions `
            -DPIXEL_PER_DEGREE_LON=10 -DPIXEL_PER_DEGREE_LAT=12 `
            -DVERSION_STR="${{ steps.version.outputs.version }}" `
            -o bin/visibility-windows-amd64.exe `
            -iquote . `
            cmd/visibility/visibility.cc thirdparty/astronomy.c `
            -lm -fopenmp 2>&1 || `
          g++ -O3 -Wall -Wextra -fno-exceptions `
            -DPIXEL_PER_DEGREE_LON=10 -DPIXEL_PER_DEGREE_LAT=12 `
            -DVERSION_STR="${{ steps.version.outputs.version }}" `
            -o bin/visibility-windows-amd64.exe `
            -iquote . `
            cmd/visibility/visibility.cc thirdparty/astronomy.c `
            -lm
          if (Test-Path bin/visibility-windows-amd64.exe) {
            echo "CPU renderer built successfully"
          } else {
            Write-Error "CPU renderer build failed"
            exit 1
          }

      - name: Build Go orchestrator (CGO)
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          go build `
            -ldflags "-X main.version=${{ steps.version.outputs.version }} -X main.buildDate=${{ steps.version.outputs.date }}" `
            -o bin/crescent_maps-windows-amd64.exe .

      - name: Run Go tests (Windows)
        shell: pwsh
        run: |
          go test ./... -count=1 -short

      - name: Upload Windows CPU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-${{ steps.version.outputs.version }}
          path: |
            bin/crescent_maps-windows-amd64.exe
            bin/visibility-windows-amd64.exe
          retention-days: 14

      - name: Verify binaries
        shell: pwsh
        run: |
          Get-ChildItem bin/ -Recurse
          if (-not (Test-Path bin/crescent_maps-windows-amd64.exe)) {
            Write-Error "Go orchestrator build failed"
            exit 1
          }
          Write-Host "Windows CPU build completed successfully" -ForegroundColor Green