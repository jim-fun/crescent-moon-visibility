name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # Needed for Cosign keyless signing

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: macos-latest
            suffix: darwin-arm64
          - os: macos-13
            suffix: darwin-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build crescent_maps (Go orchestrator)
        run: |
          CGO_ENABLED=1 go build \
            -ldflags "-X main.version=${{ steps.version.outputs.version }} -X main.buildDate=${{ steps.version.outputs.date }}" \
            -o crescent_maps-${{ steps.version.outputs.version }}-${{ matrix.suffix }}

      - name: Build CPU renderer (best effort)
        run: |
          make cpu || echo "CPU renderer build skipped or failed"
          if [ -f bin/visibility.out ]; then
            cp bin/visibility.out visibility-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          fi

      - name: Generate checksums
        run: |
          shasum -a 256 crescent_maps-${{ steps.version.outputs.version }}* visibility-${{ steps.version.outputs.version }}* 2>/dev/null | sort > checksums-${{ matrix.suffix }}.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.suffix }}
          path: |
            crescent_maps-*
            visibility-*
            checksums-*.txt
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Create combined checksums file
        run: |
          cat checksums-*.txt | sort | uniq > checksums.txt
          echo "Generated checksums.txt with $(wc -l < checksums.txt) entries"

      - name: Sign checksums with Cosign (keyless)
        run: |
          cosign sign-blob checksums.txt \
            --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem || echo "Cosign signing skipped (no OIDC or error)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            crescent_maps-*
            visibility-*
            checksums.txt
            checksums.txt.sig
            checksums.txt.pem
            LICENSE
            README.md
          generate_release_notes: true
          body: |
            ## Crescent Moon Visibility Maps Generator ${{ github.ref_name }}

            ### Downloads

            | File | Description |
            |------|-------------|
            | `crescent_maps-*` | Main Go orchestrator (recommended) |
            | `visibility-*` | CPU reference renderer |

            **Note:** The GPU renderer (`gpu_visibility.out`) has platform-specific OpenCL dependencies. It is best built locally with `make gpu`.

            ### Verifying Downloads

            1. Download `checksums.txt` and the corresponding signature files.
            2. Verify the signature:

            ```bash
            cosign verify-blob checksums.txt \
              --signature checksums.txt.sig \
              --certificate checksums.txt.pem \
              --certificate-identity-regexp "https://github.com/.*/crescent-moon-visibility" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Then verify individual files:
            ```bash
            sha256sum -c checksums.txt
            ```

            See the [README](https://github.com/jim-fun/crescent-moon-visibility/blob/main/README.md) for full installation and usage instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}