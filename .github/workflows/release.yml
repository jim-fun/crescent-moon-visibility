name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # Needed for Cosign keyless signing

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: windows-latest
            suffix: windows-amd64
          # macOS builds (darwin-arm64 / darwin-amd64) are no longer provided by CI.
          # Users on macOS (Intel + Apple Silicon) should build locally with `make`
          # (see README § Building from source and GPU dependency installation).

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Windows build environment (MinGW + CGO)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install mingw -y
          echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CXX=g++" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build crescent_maps (Go orchestrator)
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Best-effort static for the CGO orchestrator on Windows (CGO makes full static tricky)
            CGO_ENABLED=1 CGO_LDFLAGS="-static-libgcc -static-libstdc++" go build \
              -ldflags "-X main.version=${{ steps.version.outputs.version }} -X main.buildDate=${{ steps.version.outputs.date }} -extldflags '-static'" \
              -o crescent_maps-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.exe .
          else
            CGO_ENABLED=1 go build \
              -ldflags "-X main.version=${{ steps.version.outputs.version }} -X main.buildDate=${{ steps.version.outputs.date }}" \
              -o crescent_maps-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          fi

      - name: Run Go tests (non-Linux platforms)
        if: runner.os != 'Linux'
        shell: bash
        run: go test ./... -count=1 -short || true  # best-effort on Windows

      - name: Build CPU renderer (best effort)
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mkdir -p bin
            # Match the logic from the dedicated Windows CPU workflow (with OpenMP fallback)
            g++ -O3 -Wall -Wextra -fno-exceptions \
              -DPIXEL_PER_DEGREE_LON=10 -DPIXEL_PER_DEGREE_LAT=12 \
              -DVERSION_STR="${{ steps.version.outputs.version }}" \
              -o bin/visibility-windows-amd64.exe \
              -iquote . \
              cmd/visibility/visibility.cc thirdparty/astronomy.c \
              -lm -fopenmp -static -static-libgcc -static-libstdc++ 2>&1 || \
            g++ -O3 -Wall -Wextra -fno-exceptions \
              -DPIXEL_PER_DEGREE_LON=10 -DPIXEL_PER_DEGREE_LAT=12 \
              -DVERSION_STR="${{ steps.version.outputs.version }}" \
              -o bin/visibility-windows-amd64.exe \
              -iquote . \
              cmd/visibility/visibility.cc thirdparty/astronomy.c \
              -lm -static -static-libgcc -static-libstdc++
            if [ -f bin/visibility-windows-amd64.exe ]; then
              cp bin/visibility-windows-amd64.exe visibility-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.exe
            fi
          else
            make cpu || echo "CPU renderer build skipped or failed"
            if [ -f bin/visibility.out ]; then
              cp bin/visibility.out visibility-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
            fi
          fi

      # Assemble the minimal, ready-to-run package (orchestrator + CPU renderer +
      # data/map_nasa.png, binaries named so crescent_maps auto-discovers them).
      # See scripts/package.sh. Skipped (with a warning) if either binary is
      # missing, so a partial build still publishes the raw binaries as before.
      - name: Build runtime package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ORCH="crescent_maps-${VERSION}-${SUFFIX}.exe"
            REND="visibility-${VERSION}-${SUFFIX}.exe"
          else
            ORCH="crescent_maps-${VERSION}-${SUFFIX}"
            REND="visibility-${VERSION}-${SUFFIX}"
          fi
          if [[ -f "$ORCH" && -f "$REND" ]]; then
            ./scripts/package.sh --version "$VERSION" --suffix "$SUFFIX" \
              --orchestrator "$ORCH" --renderer "$REND"
            # Surface the archive at the repo root for the checksum/artifact globs.
            mv dist/crescent-moon-visibility-*.tar.gz . 2>/dev/null || true
            mv dist/crescent-moon-visibility-*.zip . 2>/dev/null || true
          else
            echo "[warn] orchestrator ($ORCH) or renderer ($REND) missing — skipping runtime package for $SUFFIX"
          fi

      - name: Generate checksums
        shell: bash
        run: |
          shasum -a 256 \
            crescent_maps-${{ steps.version.outputs.version }}* \
            visibility-${{ steps.version.outputs.version }}* \
            crescent-moon-visibility-${{ steps.version.outputs.version }}* \
            2>/dev/null | sort > checksums-${{ matrix.suffix }}.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.suffix }}
          path: |
            crescent_maps-*
            visibility-*
            crescent-moon-visibility-*
            checksums-*.txt
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute version without 'v' prefix
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Create combined checksums file
        run: |
          cat checksums-*.txt | sort | uniq > checksums.txt
          echo "Generated checksums.txt with $(wc -l < checksums.txt) entries"

      - name: Sign checksums with Cosign (keyless)
        run: |
          cosign sign-blob checksums.txt \
            --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem || echo "Cosign signing skipped (no OIDC or error)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            crescent-moon-visibility-*-linux-amd64.tar.gz
            crescent-moon-visibility-*-windows-amd64.zip
            crescent_maps-*-linux-amd64
            crescent_maps-*-windows-amd64*
            visibility-*-linux-amd64
            visibility-*-windows-amd64*
            checksums.txt
            checksums.txt.sig
            checksums.txt.pem
            LICENSE
            README.md
          generate_release_notes: true
          body: |
            ## Crescent Moon Visibility Maps Generator ${{ github.ref_name }}

            High-performance crescent moon visibility maps using a mixed-language architecture: Go orchestrator (CGO + Astronomy Engine), dual C++ / OpenCL renderers (CPU reference in double + GPU with Chebyshev ephemeris + FP32+double-double for Apple Silicon), and pure-Go blending (no Python in default path). See the **[Architecture section](https://github.com/jim-fun/crescent-moon-visibility/blob/main/README.md#architecture)** and **[Performance & Accuracy](https://github.com/jim-fun/crescent-moon-visibility/blob/main/docs/performance-accuracy.md)** for design rationale and ~96.97 % fidelity guarantees.

            ### Downloads

            **Recommended — ready-to-run packages** (orchestrator + CPU renderer + base map, runs out of the box):

            | File | Description |
            |------|-------------|
            | `crescent-moon-visibility-*-linux-amd64.tar.gz` | **Linux x64 package** — extract and run `./crescent_maps` from the folder |
            | `crescent-moon-visibility-*-windows-amd64.zip`  | **Windows x64 package** — extract and run `.\crescent_maps.exe` from the folder |

            Each package contains `crescent_maps[.exe]` (run this), `bin/visibility[.out\|.exe]` (CPU renderer, auto-discovered), and `data/map_nasa.png` (required by the blend step), plus `README.md`, `LICENSE`, and `QUICKSTART.txt`. **Keep the folder layout intact** — the program finds the renderer and base map by relative path.

            Individual binaries are also attached (`crescent_maps-*`, `visibility-*`) for users who already have a working tree with `data/map_nasa.png`; note a bare binary cannot generate maps without the CPU renderer and base map alongside it.

            **Important:** The GPU renderer (`gpu_visibility.out`) has platform-specific OpenCL / driver dependencies and is **not included** in GitHub releases. Build it locally with `make gpu` (or `make` for everything) after cloning. Full instructions: [README § GPU dependency installation](https://github.com/jim-fun/crescent-moon-visibility/blob/main/README.md#gpu-dependency-installation).

            **Quick start from release (Linux):**
            ```bash
            curl -LO https://github.com/jim-fun/crescent-moon-visibility/releases/download/${{ github.ref_name }}/crescent-moon-visibility-${{ steps.ver.outputs.version }}-linux-amd64.tar.gz
            tar -xzf crescent-moon-visibility-${{ steps.ver.outputs.version }}-linux-amd64.tar.gz
            cd crescent-moon-visibility-${{ steps.ver.outputs.version }}-linux-amd64
            ./crescent_maps -version
            ./crescent_maps -start 2027 -end 2027   # CPU; add -gpu after a local GPU build
            ```

            **Windows (x64):** download `crescent-moon-visibility-*-windows-amd64.zip`, extract, then from the folder in PowerShell:
            ```powershell
            .\crescent_maps.exe -version
            .\crescent_maps.exe -start 2027 -end 2027
            ```

            **macOS users:** Pre-built binaries are no longer provided by the release workflow.
            Clone the repository and build locally with `make` (or `make cpu` + `make gpu` as needed).
            Full instructions are in the README.
            ```bash
            git clone https://github.com/jim-fun/crescent-moon-visibility.git
            cd crescent-moon-visibility
            make
            ./bin/crescent_maps -version
            ```

            ### Verifying Downloads (Supply-Chain Security)

            1. Download `checksums.txt`, `checksums.txt.sig`, and `checksums.txt.pem`.
            2. Verify the Cosign keyless signature (GitHub OIDC):

            ```bash
            cosign verify-blob checksums.txt \
              --signature checksums.txt.sig \
              --certificate checksums.txt.pem \
              --certificate-identity-regexp "https://github.com/.*/crescent-moon-visibility" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Then verify artifacts:
            ```bash
            sha256sum -c checksums.txt
            ```

            Full release process, pre-release support (`-rc`, `-beta`), and Makefile helpers: see [README § Release Process](https://github.com/jim-fun/crescent-moon-visibility/blob/main/README.md#release-process) and `scripts/release.sh`.

            See [CHANGELOG.md](https://github.com/jim-fun/crescent-moon-visibility/blob/main/CHANGELOG.md) for detailed history and the **[crescent-moon-visibility-engineering skill](https://github.com/jim-fun/crescent-moon-visibility/blob/main/.grok/skills/crescent-moon-visibility-engineering/SKILL.md)** (internal) for architectural patterns.

            **License:** MIT (see attached LICENSE).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}