name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # Needed for Cosign keyless signing

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: macos-latest
            suffix: darwin-arm64
          - os: macos-13
            suffix: darwin-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build crescent_maps (Go orchestrator)
        run: |
          CGO_ENABLED=1 go build \
            -ldflags "-X main.version=${{ steps.version.outputs.version }} -X main.buildDate=${{ steps.version.outputs.date }}" \
            -o crescent_maps-${{ steps.version.outputs.version }}-${{ matrix.suffix }}

      - name: Build CPU renderer (best effort)
        run: |
          make cpu || echo "CPU renderer build skipped or failed"
          if [ -f bin/visibility.out ]; then
            cp bin/visibility.out visibility-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          fi

      - name: Generate checksums
        run: |
          shasum -a 256 crescent_maps-${{ steps.version.outputs.version }}* visibility-${{ steps.version.outputs.version }}* 2>/dev/null | sort > checksums-${{ matrix.suffix }}.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.suffix }}
          path: |
            crescent_maps-*
            visibility-*
            checksums-*.txt
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Create combined checksums file
        run: |
          cat checksums-*.txt | sort | uniq > checksums.txt
          echo "Generated checksums.txt with $(wc -l < checksums.txt) entries"

      - name: Sign checksums with Cosign (keyless)
        run: |
          cosign sign-blob checksums.txt \
            --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem || echo "Cosign signing skipped (no OIDC or error)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            crescent_maps-*
            visibility-*
            checksums.txt
            checksums.txt.sig
            checksums.txt.pem
            LICENSE
            README.md
          generate_release_notes: true
          body: |
            ## Crescent Moon Visibility Maps Generator ${{ github.ref_name }}

            High-performance crescent moon visibility maps using a mixed-language architecture: Go orchestrator (CGO + Astronomy Engine), dual C++ / OpenCL renderers (CPU reference in double + GPU with Chebyshev ephemeris + FP32+double-double for Apple Silicon), and pure-Go blending (no Python in default path). See the **[Architecture section](https://github.com/jim-fun/crescent-moon-visibility/blob/main/README.md#architecture)** and **[Performance & Accuracy](https://github.com/jim-fun/crescent-moon-visibility/blob/main/docs/performance-accuracy.md)** for design rationale and ~96.97 % fidelity guarantees.

            ### Downloads (Pre-built Artifacts)

            | File | Description |
            |------|-------------|
            | `crescent_maps-*` | **Main Go orchestrator** (recommended for all users; includes version reporting for bundled renderers) |
            | `visibility-*` | CPU reference renderer (pure double C++ + OpenMP; built best-effort on release runners) |

            **Important:** The GPU renderer (`gpu_visibility.out`) has platform-specific OpenCL / driver dependencies and is **not included** in GitHub releases. Build it locally with `make gpu` (or `make` for everything) after cloning. Full instructions: [README § GPU dependency installation](https://github.com/jim-fun/crescent-moon-visibility/blob/main/README.md#gpu-dependency-installation).

            **Quick start from release (Linux/macOS example):**
            ```bash
            curl -LO https://github.com/jim-fun/crescent-moon-visibility/releases/download/${{ github.ref_name }}/crescent_maps-${{ github.ref_name#v }}-linux-amd64   # (adjust suffix)
            chmod +x crescent_maps-*
            sudo mv crescent_maps-* /usr/local/bin/crescent_maps
            crescent_maps -version
            crescent_maps -help
            # For a map: crescent_maps -start 2027 -end 2027   # CPU; add -gpu after local GPU build
            ```

            ### Verifying Downloads (Supply-Chain Security)

            1. Download `checksums.txt`, `checksums.txt.sig`, and `checksums.txt.pem`.
            2. Verify the Cosign keyless signature (GitHub OIDC):

            ```bash
            cosign verify-blob checksums.txt \
              --signature checksums.txt.sig \
              --certificate checksums.txt.pem \
              --certificate-identity-regexp "https://github.com/.*/crescent-moon-visibility" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Then verify artifacts:
            ```bash
            sha256sum -c checksums.txt
            ```

            Full release process, pre-release support (`-rc`, `-beta`), and Makefile helpers: see [README § Release Process](https://github.com/jim-fun/crescent-moon-visibility/blob/main/README.md#release-process) and `scripts/release.sh`.

            See [CHANGELOG.md](https://github.com/jim-fun/crescent-moon-visibility/blob/main/CHANGELOG.md) for detailed history and the **[crescent-moon-visibility-engineering skill](https://github.com/jim-fun/crescent-moon-visibility/blob/main/.grok/skills/crescent-moon-visibility-engineering/SKILL.md)** (internal) for architectural patterns.

            **License:** MIT (see attached LICENSE).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}